services:
  postgres:
    image: postgres:17-alpine
    container_name: sistema-comercial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sistema_comercial}
      POSTGRES_USER: ${DB_USER:-sistema_comercial}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sistema_comercial} -d ${DB_NAME:-sistema_comercial}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
